name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Fix Package Name in pubspec.yaml
        run: |
          python3 -c "
          import yaml

          with open('pubspec.yaml', 'r') as f:
              data = yaml.safe_load(f)

          data['name'] = 'cam2pdf'

          with open('pubspec.yaml', 'w') as f:
              yaml.dump(data, f, sort_keys=False)

          print('pubspec.yaml aggiornato con successo:')
          with open('pubspec.yaml', 'r') as f:
              print(f.read())
          "

      - name: Ensure Android platform exists
        run: flutter create . --platforms=android

      - name: Generate Apple-style Dark & Red PDF Icon
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw
          
          # Icona dark con accenti rossi (stile PDF)
          img = Image.new('RGBA', (1024, 1024), (18, 20, 26, 255))
          draw = ImageDraw.Draw(img)
          
          # Documento centrale (sfondo chiaro pulito con bordo rosso in alto)
          draw.rectangle([312, 230, 712, 794], fill=(240, 242, 245, 255))
          draw.rectangle([312, 230, 712, 310], fill=(217, 48, 37, 255)) # Striscia rossa PDF
          
          # Testo fittizio sul documento (righe grigie)
          draw.rectangle([372, 370, 652, 394], fill=(200, 205, 215, 255))
          draw.rectangle([372, 450, 652, 474], fill=(200, 205, 215, 255))
          draw.rectangle([372, 530, 532, 554], fill=(200, 205, 215, 255))
          
          # Etichetta PDF in evidenza
          draw.rectangle([372, 620, 480, 680], fill=(217, 48, 37, 255))
          
          # Obiettivo fotocamera minimale in basso a destra sul documento
          draw.ellipse([570, 590, 672, 692], outline=(30, 35, 45, 255), width=12)
          draw.ellipse([600, 620, 642, 662], fill=(217, 48, 37, 255))
          
          img.save('app_icon.png')
          "
          
          python3 -c "
          import yaml
          with open('pubspec.yaml', 'r') as f:
              data = yaml.safe_load(f)
          if not data.get('dev_dependencies'):
              data['dev_dependencies'] = {}
          data['dev_dependencies']['flutter_launcher_icons'] = '^0.13.1'
          data['flutter_icons'] = {
              'android': True,
              'ios': True,
              'image_path': 'app_icon.png'
          }
          with open('pubspec.yaml', 'w') as f:
              yaml.dump(data, f, sort_keys=False)
          "

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Dependencies and Generate Icons
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons

      - name: Build APK (Debug)
        run: flutter build apk --debug --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cam2pdf-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
