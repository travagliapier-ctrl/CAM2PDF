name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Scaffolding a fresh, modern Flutter project
        run: |
          flutter config --no-analytics
          
          # Salva la cartella del codice sorgente se esiste
          mkdir -p /tmp/backup_project
          if [ -d "lib" ]; then cp -r lib /tmp/backup_project/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml /tmp/backup_project/; fi
          
          # Ripulisce la cartella escludendo i file di workflow e git
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' -exec rm -rf {} +
          
          # Crea un progetto Flutter nuovissimo e pulito con Gradle aggiornato
          flutter create . --org com.cam2pdf --project-name cam2pdf
          
          # Ripristina il codice sorgente dell'utente
          if [ -d "/tmp/backup_project/lib" ]; then
            rm -rf lib
            cp -r /tmp/backup_project/lib .
          fi

      - name: Generate Apple-style Dark & Red PDF Icon
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw
          
          img = Image.new('RGBA', (1024, 1024), (18, 20, 26, 255))
          draw = ImageDraw.Draw(img)
          
          draw.rectangle([312, 230, 712, 794], fill=(240, 242, 245, 255))
          draw.rectangle([312, 230, 712, 310], fill=(217, 48, 37, 255))
          
          draw.rectangle([372, 370, 652, 394], fill=(200, 205, 215, 255))
          draw.rectangle([372, 450, 652, 474], fill=(200, 205, 215, 255))
          draw.rectangle([372, 530, 532, 554], fill=(200, 205, 215, 255))
          
          draw.rectangle([372, 620, 480, 680], fill=(217, 48, 37, 255))
          draw.ellipse([570, 590, 672, 692], outline=(30, 35, 45, 255), width=12)
          draw.ellipse([600, 620, 642, 662], fill=(217, 48, 37, 255))
          
          img.save('app_icon.png')
          "

          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          
          if 'flutter_launcher_icons' not in content:
              if 'dev_dependencies:' in content:
                  content = content.replace('dev_dependencies:', 'dev_dependencies:\n  flutter_launcher_icons: ^0.13.1')
              else:
                  content += '\ndev_dependencies:\n  flutter_launcher_icons: ^0.13.1\n'
          
          if 'flutter_icons:' not in content:
              content += '\nflutter_icons:\n  android: true\n  ios: true\n  image_path: \"app_icon.png\"\n'
              
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Dependencies and Generate Icons
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons

      - name: Build APK (Debug)
        run: flutter build apk --debug --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: cam2pdf-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
