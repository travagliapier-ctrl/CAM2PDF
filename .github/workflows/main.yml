name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Configure Flutter & Force Lowercase Package Name
        run: |
          flutter config --no-analytics
          # Riscrive la prima riga del nome nel pubspec.yaml forzando cam2pdf
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              lines = f.readlines()
          with open('pubspec.yaml', 'w') as f:
              for line in lines:
                  if line.strip().startswith('name:'):
                      f.write('name: cam2pdf\n')
                  else:
                      f.write(line)
          "
          cat pubspec.yaml | head -n 5

      - name: Ensure Android platform exists
        run: flutter create . --platforms=android

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Debug)
        run: flutter build apk --debug --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cam2pdf-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
