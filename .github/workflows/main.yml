name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffolding a fresh, modern Flutter project
        run: |
          flutter config --no-analytics
          
          # Pulisce la cartella mantenendo solo il workflow
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' -exec rm -rf {} +
          
          # Crea il progetto nativo
          flutter create . --org com.cam2pdf --project-name cam2pdf

      - name: Inject Dependencies, Permissions & Stable Main Code
        run: |
          pip install Pillow
          
          # Generazione Icona App
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (1024, 1024), (18, 20, 26, 255))
          draw = ImageDraw.Draw(img)
          draw.rectangle([312, 230, 712, 794], fill=(240, 242, 245, 255))
          draw.rectangle([312, 230, 712, 310], fill=(217, 48, 37, 255))
          draw.rectangle([372, 370, 652, 394], fill=(200, 205, 215, 255))
          draw.rectangle([372, 450, 652, 474], fill=(200, 205, 215, 255))
          draw.rectangle([372, 530, 532, 554], fill=(200, 205, 215, 255))
          draw.rectangle([372, 620, 480, 680], fill=(217, 48, 37, 255))
          draw.ellipse([570, 590, 672, 692], outline=(30, 35, 45, 255), width=12)
          draw.ellipse([600, 620, 642, 662], fill=(217, 48, 37, 255))
          img.save('app_icon.png')
          "

          # Configurazione pubspec.yaml
          python3 -c "
          pubspec_content = '''name: cam2pdf
          description: 'Applicazione professionale e stabile per la scansione e creazione di PDF.'
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.1.2
            pdf: ^3.11.1
            path_provider: ^2.1.4
            share_plus: ^10.0.1
            cupertino_icons: ^1.0.8

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
            flutter_launcher_icons: ^0.13.1

          flutter:
            uses-material-design: true

          flutter_icons:
            android: true
            ios: true
            image_path: 'app_icon.png'
          '''
          with open('pubspec.yaml', 'w') as f:
              f.write(pubspec_content)
          "

          # Iniezione Permessi in AndroidManifest.xml
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              manifest = f.read()
          
          permissions = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
          '''
          
          if 'android.permission.CAMERA' not in manifest:
              manifest = manifest.replace('<application', permissions + '\n    <application')
              with open(manifest_path, 'w') as f:
                  f.write(manifest)
          "

          # Scrittura del Codice Dart ultra-stabile
          python3 -c "
          main_code = '''import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:path_provider/path_provider.dart';
          import 'package:share_plus/share_plus.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const Cam2PdfApp());
          }

          class Cam2PdfApp extends StatelessWidget {
            const Cam2PdfApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Cam2PDF',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFFD93025),
                    brightness: Brightness.dark,
                  ),
                  useMaterial3: true,
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final List<XFile> _scannedPages = [];
            final ImagePicker _picker = ImagePicker();
            bool _isGenerating = false;

            Future<void> _captureImage() async {
              try {
                final XFile? photo = await _picker.pickImage(
                  source: ImageSource.camera,
                  imageQuality: 85,
                );
                if (photo != null) {
                  setState(() {
                    _scannedPages.add(photo);
                  });
                }
              } catch (e) {
                _showSnackBar('Errore nell accedere alla fotocamera: \$e');
              }
            }

            Future<void> _pickFromGallery() async {
              try {
                final List<XFile> images = await _picker.pickMultiImage(
                  imageQuality: 85,
                );
                if (images.isNotEmpty) {
                  setState(() {
                    _scannedPages.addAll(images);
                  });
                }
              } catch (e) {
                _showSnackBar('Errore durante la selezione delle immagini: \$e');
              }
            }

            Future<void> _generateAndSharePdf() async {
              if (_scannedPages.isEmpty) return;

              setState(() {
                _isGenerating = true;
              });

              try {
                final pdf = pw.Document();

                for (var imageFile in _scannedPages) {
                  final bytes = await File(imageFile.path).readAsBytes();
                  final imageProvider = pw.MemoryImage(bytes);

                  pdf.addPage(
                    pw.Page(
                      pageFormat: PdfPageFormat.a4,
                      margin: const pw.EdgeInsets.all(16),
                      build: (pw.Context context) {
                        return pw.Center(
                          child: pw.Image(imageProvider, fit: pw.BoxFit.contain),
                        );
                      },
                    ),
                  );
                }

                final outputDir = await getTemporaryDirectory();
                final timeStamp = DateTime.now().millisecondsSinceEpoch;
                final pdfPath = '\${outputDir.path}/scansione_\$timeStamp.pdf';
                final pdfFile = File(pdfPath);

                await pdfFile.writeAsBytes(await pdf.save());

                setState(() {
                  _isGenerating = false;
                });

                await Share.shareXFiles(
                  [XFile(pdfPath)],
                  text: 'Ecco il tuo documento PDF generato con Cam2PDF',
                );
              } catch (e) {
                setState(() {
                  _isGenerating = false;
                });
                _showSnackBar('Si e verificato un errore nella creazione del PDF: \$e');
              }
            }

            void _removePage(int index) {
              setState(() {
                _scannedPages.removeAt(index);
              });
            }

            void _clearAll() {
              setState(() {
                _scannedPages.clear();
              });
            }

            void _showSnackBar(String message) {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(message)),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Cam2PDF Scanner'),
                  actions: [
                    if (_scannedPages.isNotEmpty)
                      IconButton(
                        icon: const Icon(Icons.delete_sweep),
                        tooltip: 'Cancella tutto',
                        onPressed: _clearAll,
                      ),
                  ],
                ),
                body: _isGenerating
                    ? const Center(
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            CircularProgressIndicator(),
                            SizedBox(height: 16),
                            Text('Generazione del PDF in corso...'),
                          ],
                        ),
                      )
                    : _scannedPages.isEmpty
                        ? Center(
                            child: Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Icon(
                                  Icons.document_scanner,
                                  size: 80,
                                  color: Colors.grey.shade600,
                                ),
                                const SizedBox(height: 16),
                                const Text(
                                  'Nessuna pagina acquisita',
                                  style: TextStyle(fontSize: 18),
                                ),
                                const SizedBox(height: 8),
                                Text(
                                  'Scatta una foto o seleziona immagini per iniziare',
                                  style: TextStyle(color: Colors.grey.shade400),
                                ),
                              ],
                            ),
                          )
                        : GridView.builder(
                            padding: const EdgeInsets.all(12),
                            gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                              crossAxisCount: 2,
                              crossAxisSpacing: 10,
                              mainAxisSpacing: 10,
                              childAspectRatio: 0.7,
                            ),
                            itemCount: _scannedPages.length,
                            itemBuilder: (context, index) {
                              return Stack(
                                children: [
                                  Positioned.fill(
                                    child: ClipRRect(
                                      borderRadius: BorderRadius.circular(8),
                                      child: Image.file(
                                        File(_scannedPages[index].path),
                                        fit: BoxFit.cover,
                                      ),
                                    ),
                                  ),
                                  Positioned(
                                    top: 4,
                                    left: 4,
                                    child: CircleAvatar(
                                      radius: 12,
                                      backgroundColor: Colors.black87,
                                      child: Text(
                                        '\${index + 1}',
                                        style: const TextStyle(
                                          fontSize: 12,
                                          color: Colors.white,
                                        ),
                                      ),
                                    ),
                                  ),
                                  Positioned(
                                    top: 4,
                                    right: 4,
                                    child: GestureDetector(
                                      onTap: () => _removePage(index),
                                      child: const CircleAvatar(
                                        radius: 14,
                                        backgroundColor: Colors.red,
                                        child: Icon(
                                          Icons.close,
                                          size: 16,
                                          color: Colors.white,
                                        ),
                                      ),
                                    ),
                                  ),
                                ],
                              );
                            },
                          ),
                bottomNavigationBar: SafeArea(
                  child: Container(
                    padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                    color: Theme.of(context).scaffoldBackgroundColor,
                    child: Row(
                      children: [
                        Expanded(
                          child: OutlinedButton.icon(
                            onPressed: _pickFromGallery,
                            icon: const Icon(Icons.photo_library),
                            label: const Text('Galleria'),
                          ),
                        ),
                        const SizedBox(width: 8),
                        Expanded(
                          child: ElevatedButton.icon(
                            onPressed: _captureImage,
                            icon: const Icon(Icons.camera_alt),
                            label: const Text('Scatta'),
                            style: ElevatedButton.styleFrom(
                              backgroundColor: const Color(0xFFD93025),
                              foregroundColor: Colors.white,
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
                floatingActionButton: _scannedPages.isNotEmpty
                    ? FloatingActionButton.extended(
                        onPressed: _generateAndSharePdf,
                        icon: const Icon(Icons.picture_as_pdf),
                        label: Text('Crea PDF (\${_scannedPages.length})'),
                        backgroundColor: Colors.green,
                      )
                    : null,
              );
            }
          }
          '''
          with open('lib/main.dart', 'w') as f:
              f.write(main_code)
          "

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Dependencies and Generate Icons
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons

      - name: Build APK (Debug)
        run: flutter build apk --debug --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: cam2pdf-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
